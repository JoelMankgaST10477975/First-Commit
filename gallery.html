<!doctype html>

<head>
    <script>

document.addEventListener("DOMContentLoaded", () => {
  const details = document.querySelectorAll("details");
  details.forEach((item) => {
    item.addEventListener("toggle", () => {
      details.forEach((other) => {
        if (other !== item) other.removeAttribute("open");
      });
    });
  });
});


function validateForm(event, formType) {
  event.preventDefault();
  let name = document.getElementById(formType + "Name").value.trim();
  let email = document.getElementById(formType + "Email").value.trim();
  let message = document.getElementById(formType + "Message").value.trim();

  if (name.length < 2) {
    alert("Please enter a valid name.");
    return false;
  }
  if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) {
    alert("Please enter a valid email address.");
    return false;
  }
  if (message.length < 10) {
    alert("Message must be at least 10 characters.");
    return false;
  }

  alert(formType + " form submitted successfully!");
  return true;
}


function openLightbox(imgSrc) {
  let lightbox = document.getElementById("lightbox");
  let lightboxImg = document.getElementById("lightboxImg");
  lightbox.style.display = "block";
  lightboxImg.src = imgSrc;
}
function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}


const testimonials = [
  "Daycare4Dogs is amazing! My pup loves it here.",
  "Friendly staff and safe environment — highly recommend.",
  "Affordable and caring service, my dog feels at home."
];
function loadTestimonials() {
  let container = document.getElementById("testimonialContainer");
  testimonials.forEach((text) => {
    let p = document.createElement("p");
    p.textContent = text;
    container.appendChild(p);
  });
}
</script>
